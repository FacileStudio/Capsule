openapi: 3.1.0
info:
  title: Capsule API
  description: |
    Zero-knowledge encrypted paste sharing. The server stores ciphertext — it never sees your plaintext.

    ## How it works

    1. Client encrypts content with AES-256-GCM using Web Crypto API
    2. `POST /pastes` sends the ciphertext to the server
    3. Server returns a paste ID — the encryption key stays client-side (URL fragment)
    4. Recipient fetches ciphertext via `POST /pastes/{id}/content` and decrypts in-browser
    5. Paste is burned after reading (default) or after N views

    ## Authentication

    No authentication required for basic operations. Paste deletion requires
    the `X-Delete-Token` returned at creation time.
  version: 1.0.0
  contact:
    name: Facile Studio
    url: https://facile.studio
  license:
    name: MIT

servers:
  - url: https://capsule.facile.studio
    description: Production
  - url: http://localhost:4000
    description: Local development

tags:
  - name: Pastes
    description: Create, read, and revoke encrypted pastes
  - name: Health
    description: Service health and readiness checks

paths:
  /pastes:
    post:
      operationId: createPaste
      summary: Create a paste
      description: |
        Store encrypted content on the server. The request body should contain
        client-side encrypted ciphertext — the server stores it as-is.

        Rate limited to 30 requests per minute per IP.
      tags: [Pastes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequest"
            examples:
              minimal:
                summary: Burn-after-read paste
                value:
                  content: "encrypted-ciphertext-base64..."
              with_options:
                summary: Paste with expiry and syntax
                value:
                  content: "encrypted-ciphertext-base64..."
                  burn_after_read: false
                  expires_in: "24h"
                  max_views: 5
                  has_password: true
                  syntax: "json"
      responses:
        "201":
          description: Paste created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateResponse"
              example:
                id: "cap_a1b2c3d4e5f6g7h8"
                delete_token: "64-char-hex-token..."
                expires_at: "2025-05-21T12:00:00Z"
                created_at: "2025-05-20T12:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /pastes/{id}:
    get:
      operationId: getPasteMeta
      summary: Get paste metadata
      description: |
        Check if a paste exists and retrieve its metadata. Returns `exists: false`
        if the paste was burned, expired, or never existed — no 404.
      tags: [Pastes]
      parameters:
        - $ref: "#/components/parameters/PasteID"
      responses:
        "200":
          description: Paste metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"
              examples:
                exists:
                  summary: Active paste
                  value:
                    id: "cap_a1b2c3d4e5f6g7h8"
                    exists: true
                    burned: false
                    has_password: true
                    syntax: "python"
                    expires_at: "2025-05-21T12:00:00Z"
                    created_at: "2025-05-20T12:00:00Z"
                not_found:
                  summary: Burned or nonexistent paste
                  value:
                    id: "cap_a1b2c3d4e5f6g7h8"
                    exists: false

    delete:
      operationId: revokePaste
      summary: Revoke a paste
      description: |
        Permanently destroy a paste. Requires the `X-Delete-Token` header
        returned during creation. The paste content is wiped and marked as burned.
      tags: [Pastes]
      parameters:
        - $ref: "#/components/parameters/PasteID"
        - name: X-Delete-Token
          in: header
          required: true
          description: Delete token returned when the paste was created
          schema:
            type: string
            minLength: 64
            maxLength: 64
      responses:
        "200":
          description: Paste revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    const: true
              example:
                deleted: true
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /pastes/{id}/content:
    post:
      operationId: getPasteContent
      summary: Get paste content
      description: |
        Retrieve the encrypted content of a paste. This is a POST (not GET) to
        avoid caching of sensitive data.

        If `burn_after_read` is enabled, the paste is destroyed after this call.
        If `max_views` is set, the paste burns when the view count is reached.
      tags: [Pastes]
      parameters:
        - $ref: "#/components/parameters/PasteID"
      responses:
        "200":
          description: Encrypted paste content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentResponse"
              example:
                content: "encrypted-ciphertext-base64..."
        "404":
          $ref: "#/components/responses/NotFound"

  /health:
    get:
      operationId: healthCheck
      summary: Health check
      description: Returns `ok` if the server is running.
      tags: [Health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: "ok"

  /ready:
    get:
      operationId: readinessCheck
      summary: Readiness check
      description: Returns `ready` if the server can reach the database.
      tags: [Health]
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: "ready"
        "503":
          description: Not ready (database unreachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: "not_ready"

components:
  parameters:
    PasteID:
      name: id
      in: path
      required: true
      description: Paste ID (prefixed with `cap_`)
      schema:
        type: string
        pattern: "^cap_[a-f0-9]{16}$"
        example: "cap_a1b2c3d4e5f6g7h8"

  schemas:
    CreateRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: Encrypted ciphertext (client-side AES-256-GCM)
          minLength: 1
          maxLength: 1048576
        burn_after_read:
          type: boolean
          description: Destroy after first read
          default: true
        expires_in:
          type: string
          description: Time-to-live duration
          enum: ["1h", "24h", "7d", "30d"]
        max_views:
          type: integer
          description: Burn after N views (ignored if `burn_after_read` is true)
          minimum: 1
        has_password:
          type: boolean
          description: Whether the content is additionally wrapped with a password-derived key
          default: false
        syntax:
          type: string
          description: Syntax language for highlighting on reveal
          enum:
            - plaintext
            - javascript
            - typescript
            - python
            - go
            - rust
            - json
            - yaml
            - bash
            - sql
            - html
            - css
            - markdown

    CreateResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique paste ID
          example: "cap_a1b2c3d4e5f6g7h8"
        delete_token:
          type: string
          description: Token for revoking this paste — store it safely
          example: "a1b2c3d4..."
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the paste expires (null if no expiry)
        created_at:
          type: string
          format: date-time

    MetaResponse:
      type: object
      properties:
        id:
          type: string
        exists:
          type: boolean
          description: Whether the paste is available for reading
        burned:
          type: boolean
        has_password:
          type: boolean
        syntax:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true

    ContentResponse:
      type: object
      properties:
        content:
          type: string
          description: Encrypted ciphertext

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: ["ok", "ready", "not_ready"]

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code
              enum:
                - invalid_argument
                - unauthenticated
                - permission_denied
                - not_found
                - already_exists
                - failed_precondition
                - resource_exhausted
                - internal
            message:
              type: string
              description: Human-readable error message

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "invalid_argument"
              message: "content is required"
    NotFound:
      description: Paste not found, burned, or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "not_found"
              message: "paste not found"
    Forbidden:
      description: Invalid or missing delete token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "permission_denied"
              message: "invalid delete token"
    TooLarge:
      description: Content exceeds maximum paste size
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "resource_exhausted"
              message: "content exceeds maximum paste size"
