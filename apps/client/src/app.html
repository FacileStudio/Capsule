<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			/*
			 * Pre-paint theme, mirroring $lib/theme.svelte.ts. Both classes are written and
			 * "system" writes neither: muse's tokens flip on prefers-color-scheme scoped to
			 * `:root:not(.light)`, so `.light` is the only thing that lets someone force
			 * light on a dark OS, and a script that only ever adds `.dark` strands them.
			 */
			(function () {
				var t = localStorage.getItem('capsule-theme');
				if (t === 'dark' || t === 'light') document.documentElement.classList.add(t);
			})();
		</script>
		<script>
			/*
			 * Vision records the page path. A reveal page's path is the capsule id, which is enough
			 * to burn a capsule, so the tracker loads on the landing and revoke pages only.
			 */
			(function () {
				var p = location.pathname;
				if (p !== '/' && p !== '/revoke') return;
				var s = document.createElement('script');
				s.async = true;
				s.src = 'https://vision.facile.studio/s.js';
				document.head.appendChild(s);
			})();
		</script>

		<title>Capsule · Share a secret that self-destructs</title>
		<meta name="description" content="Encrypted end to end in the browser, so the server never sees the content. You choose when it expires." />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Facile" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:url" content="https://capsule.facile.studio/" />
		<meta property="og:title" content="Capsule · Share a secret that self-destructs" />
		<meta property="og:description" content="Encrypted end to end in the browser, so the server never sees the content. You choose when it expires." />
		<meta property="og:image" content="https://capsule.facile.studio/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Capsule: Share a secret that self-destructs" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Capsule · Share a secret that self-destructs" />
		<meta name="twitter:description" content="Encrypted end to end in the browser, so the server never sees the content. You choose when it expires." />
		<meta name="twitter:image" content="https://capsule.facile.studio/og-image.png" />

		<meta name="color-scheme" content="light dark" />

		%sveltekit.head%

	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
