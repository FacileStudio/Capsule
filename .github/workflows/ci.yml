name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: capsule
          POSTGRES_PASSWORD: capsule
          POSTGRES_DB: capsule
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capsule"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://capsule:capsule@localhost:5432/capsule?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: apps/api/go.sum

      - run: go mod download

      - run: go vet ./...

      - run: go build ./...

      - run: go test ./...

  client:
    name: Client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/client

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('apps/client/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [api, client]

    steps:
      - uses: actions/checkout@v4

      - run: docker compose build

      - name: Verify containers start
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if docker compose ps --format '{{.Health}}' | grep -q unhealthy; then
              echo "Unhealthy container detected"; docker compose logs; exit 1
            fi
            TOTAL=$(docker compose ps -q | wc -l)
            HEALTHY=$(docker compose ps --format '{{.Health}}' | grep -c healthy || true)
            NONE=$(docker compose ps --format '{{.Health}}' | grep -c "^$" || true)
            READY=$((HEALTHY + NONE))
            if [ "$READY" -eq "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              echo "All $TOTAL containers ready"; break
            fi
            echo "Waiting... ($HEALTHY healthy, attempt $i/30)"
            sleep 5
          done
          docker compose ps
          docker compose logs
          docker compose down
