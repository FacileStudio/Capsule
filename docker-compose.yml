services:
  capsule-db:
    container_name: capsule-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: capsule
      POSTGRES_PASSWORD: capsule-internal-db
      POSTGRES_DB: capsule
    volumes:
    - db_data:/var/lib/postgresql/data
    expose:
    - '5432'
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '5432'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  capsule-api:
    container_name: capsule-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    expose:
    - '4000'
    networks:
    - default
    - dokploy-network
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dokploy-network
      traefik.http.routers.capsule-web.rule: Host(`capsule.facile.studio`)
      traefik.http.routers.capsule-web.entrypoints: web
      traefik.http.routers.capsule-web.middlewares: redirect-to-https@file
      traefik.http.routers.capsule-web.service: capsule-svc
      traefik.http.routers.capsule-secure.rule: Host(`capsule.facile.studio`)
      traefik.http.routers.capsule-secure.entrypoints: websecure
      traefik.http.routers.capsule-secure.tls.certresolver: letsencrypt
      traefik.http.routers.capsule-secure.service: capsule-svc
      traefik.http.services.capsule-svc.loadbalancer.server.port: '4000'
    environment:
      DATABASE_URL: postgres://capsule:capsule-internal-db@capsule-db:5432/capsule?sslmode=disable
      PORT: '4000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      JOURNAL_URL: ${JOURNAL_URL:-}
      JOURNAL_TOKEN: ${JOURNAL_TOKEN:-}
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '4000'
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      capsule-db:
        condition: service_healthy
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
volumes:
  db_data:
    name: capsule_db_data
networks:
  dokploy-network:
    external: true
