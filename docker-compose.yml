services:
  capsule-db:
    container_name: capsule-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: capsule
      POSTGRES_PASSWORD: capsule-internal-db
      POSTGRES_DB: capsule
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capsule"]
      interval: 5s
      timeout: 5s
      retries: 10

  capsule-api:
    container_name: capsule-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    expose:
      - "4000"
    networks:
      - default
      - dokploy-network
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.capsule-api-web.rule: "Host(`capsule.facile.studio`) && PathPrefix(`/api`)"
      traefik.http.routers.capsule-api-web.entrypoints: web
      traefik.http.routers.capsule-api-web.middlewares: redirect-to-https@file
      traefik.http.routers.capsule-api-web.service: capsule-api-svc
      traefik.http.routers.capsule-api-secure.rule: "Host(`capsule.facile.studio`) && PathPrefix(`/api`)"
      traefik.http.routers.capsule-api-secure.entrypoints: websecure
      traefik.http.routers.capsule-api-secure.tls.certresolver: letsencrypt
      traefik.http.routers.capsule-api-secure.middlewares: capsule-strip-api
      traefik.http.routers.capsule-api-secure.service: capsule-api-svc
      traefik.http.middlewares.capsule-strip-api.stripprefix.prefixes: /api
      traefik.http.services.capsule-api-svc.loadbalancer.server.port: "4000"
    environment:
      DATABASE_URL: postgres://capsule:capsule-internal-db@capsule-db:5432/capsule?sslmode=disable
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Journal log shipping (optional — per-app key from Journal's Keys page; Capsule is not on journal's docker network, so use the public URL https://journal.facile.studio/api)
      JOURNAL_URL: ${JOURNAL_URL:-}
      JOURNAL_TOKEN: ${JOURNAL_TOKEN:-}
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      capsule-db:
        condition: service_healthy

  capsule-client:
    container_name: capsule-client
    restart: unless-stopped
    build:
      context: apps/client
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      API_URL: http://capsule-api:4000
      ORIGIN: ${ORIGIN:-http://localhost:3000}
    depends_on:
      capsule-api:
        condition: service_healthy

volumes:
  db_data:
    name: capsule_db_data

networks:
  dokploy-network:
    external: true
