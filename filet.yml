# The Go family's coding standard, enforced by filet.
# https://github.com/FacileStudio/filet
#
#   filet check .     the rules
#   filet gate .      format, rules, analyzers, tests, fuzz seeds and douane, in order
#
# `preset: facile` is the suite standard. What follows is only what Capsule needs on top
# of it. A list or map set here replaces the preset's, so requiredFiles restates the
# preset's rule beside Capsule's one exception.

preset: facile
kind: app

architecture:
  requiredFiles:
    "apps/api/modules/*": [router.go]
    "apps/api/modules/docs": []  # static OpenAPI spec, no HTTP routes
